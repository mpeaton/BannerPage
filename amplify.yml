version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "No build step required - this is a pure static site"
    build:
      commands:
        - echo "Static assets ready for deployment"
  artifacts:
    baseDirectory: html
    files:
      - '**/*'
  cache:
    paths: []
# This file tells AWS Amplify:
# - There is no npm/webpack/etc build needed (pure static HTML + CSS + video).
# - The site files live in the `html/` directory (index.html + resources/).
# In the Amplify console "Build settings":
#   - Frontend build command: (can be left as the echo above, or blank)
#   - Build output directory: html
# Note: For the animation video and poster, Amplify will serve them with good caching by default.
# If you need longer cache for assets, you can configure in Amplify console under Rewrites and redirects.